[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "driverforge"
version = "0.1.0"
description = "Local source-linked fault campaigns for Python instrument drivers"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
pymeasure = ["pymeasure==0.16.0"]

[project.scripts]
driverforge = "driverforge.cli:main"

[project.entry-points.pytest11]
driverforge = "driverforge.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
driverforge = ["py.typed", "data/*.json", "data/*.md", "data/*.lock", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/driverforge"]

[[tool.mypy.overrides]]
module = ["pymeasure.*", "pytest"]
ignore_missing_imports = true
