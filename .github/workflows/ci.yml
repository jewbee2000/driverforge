name: DriverForge checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.2"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install pinned dependencies
        run: .venv\Scripts\python.exe -m pip install -r requirements.lock

      - name: Install project
        run: .venv\Scripts\python.exe -m pip install --no-build-isolation -e ".[pymeasure]"

      - name: Check dependencies
        run: .venv\Scripts\python.exe -m pip check

      - name: Lint
        run: .venv\Scripts\python.exe -m ruff check src tests tools examples

      - name: Check formatting
        run: .venv\Scripts\python.exe -m ruff format --check src tests tools examples

      - name: Check types
        run: .venv\Scripts\python.exe -m mypy

      - name: Run tests
        run: .venv\Scripts\python.exe -m pytest -q --junitxml=artifacts/junit.xml --basetemp=artifacts/pytest-tmp

      - name: Run offline demonstration
        if: always()
        run: .venv\Scripts\python.exe -m driverforge demo --offline --output artifacts/demo

      - name: Build wheel
        run: .venv\Scripts\python.exe -m build --wheel --no-isolation

      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: driverforge-windows-results
          retention-days: 14
          path: |
            artifacts/
            dist/